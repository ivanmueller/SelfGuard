name: build

# Builds both executables on a real Windows machine and publishes them so you (or
# anyone) can DOWNLOAD the .exe files with no Go toolchain installed.
#   - Every push: the .exe files appear under the run's "Artifacts".
#   - Every tag like v1.0.0: a GitHub Release is created with the .exe attached.

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Resolve dependencies
        run: go mod tidy

      - name: Build service
        run: go build -ldflags "-s -w" -o dist/selfguard-svc.exe .

      - name: Build GUI (no console window)
        run: go build -ldflags "-s -w -H windowsgui" -o dist/SelfGuard.exe ./gui

      - name: Copy docs
        run: copy README.md dist\README.md

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SelfGuard-windows
          path: dist/*

      - name: Publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/SelfGuard.exe
            dist/selfguard-svc.exe
