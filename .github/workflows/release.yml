name: Build and release SelfGuard

# Publishes a release with both exes + a manifest whenever you push a version
# tag like v1.6.0. The app reads the manifest from the "latest" release and
# updates itself.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write   # needed to create the release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Version from tag
        id: ver
        run: echo "v=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build service and GUI (Windows amd64)
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: '0'
        run: |
          VER='${{ steps.ver.outputs.v }}'
          go build -ldflags "-s -w -X main.version=${VER}" -o selfguard-svc.exe .
          go build -ldflags "-s -w -H windowsgui -X main.version=${VER}" -o SelfGuard.exe ./gui

      - name: Manifest with SHA-256
        run: |
          VER='${{ steps.ver.outputs.v }}'
          SVC=$(sha256sum selfguard-svc.exe | cut -d' ' -f1)
          GUI=$(sha256sum SelfGuard.exe    | cut -d' ' -f1)
          printf '{"version":"%s","svc_sha256":"%s","gui_sha256":"%s"}\n' "$VER" "$SVC" "$GUI" > manifest.json
          echo "service $SVC"; echo "gui $GUI"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            selfguard-svc.exe
            SelfGuard.exe
            manifest.json
